services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: v380-web-camera
    ports:
      - "0.0.0.0:${PORT:-8090}:3000"
    environment:
      PORT: "3000"
      BIND_HOST: "0.0.0.0"
      MOCK_CAMERA: "${MOCK_CAMERA:-0}"
      DECODER_URL: "${DECODER_URL:-http://v380decoder:8080}"
      ACCESS_TOKEN: "${ACCESS_TOKEN:-change-me}"
      STREAM_TIMEOUT_SEC: "${STREAM_TIMEOUT_SEC:-120}"
      DEVICE_ID: "${DEVICE_ID:-89370567}"
      CAMERA_USERNAME: "${CAMERA_USERNAME:-admin}"
      CAMERA_PASSWORD: "${CAMERA_PASSWORD:-}"
      SOURCE: "${SOURCE:-cloud}"
    restart: unless-stopped
    networks:
      - v380net

  # V380Decoder ArgParser only accepts "--flag value" (NOT "--flag=value").
  v380decoder:
    profiles: ["real"]
    image: v380decoder:local
    build:
      context: https://github.com/PyanSofyan/V380Decoder.git
      dockerfile: Dockerfile
    container_name: v380decoder
    entrypoint: ["./V380Decoder"]
    command:
      - "--id"
      - "${DEVICE_ID:-89370567}"
      - "--username"
      - "${CAMERA_USERNAME:-admin}"
      - "--password"
      - "${CAMERA_PASSWORD}"
      - "--source"
      - "${SOURCE:-cloud}"
      - "--output"
      - "rtsp"
      - "--enable-api"
      - "--enable-mjpeg"
      - "--http-port"
      - "8080"
      - "--rtsp-port"
      - "8554"
    environment:
      SOURCE: "${SOURCE:-cloud}"
      DEVICE_ID: "${DEVICE_ID:-89370567}"
      CAMERA_USERNAME: "${CAMERA_USERNAME:-admin}"
      CAMERA_PASSWORD: "${CAMERA_PASSWORD:-}"
    ports:
      - "0.0.0.0:${DECODER_HTTP_PORT:-18080}:8080"
      - "0.0.0.0:${DECODER_RTSP_PORT:-18554}:8554"
    expose:
      - "8080"
      - "8554"
    restart: unless-stopped
    networks:
      - v380net

networks:
  v380net:
    driver: bridge
